<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Glance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='6' rx='1.5' fill='%230ca30c'/%3E%3Crect x='9' y='1' width='6' height='6' rx='1.5' fill='%233987e5'/%3E%3Crect x='1' y='9' width='6' height='6' rx='1.5' fill='%233987e5'/%3E%3Crect x='9' y='9' width='6' height='6' rx='1.5' fill='%231c5cab'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true"></span><b id="cluster">cluster</b><span class="sub">GPUs</span></div>
  <div class="meta">
    <span id="fresh" class="fresh"><i aria-hidden="true"></i><span>loading…</span></span>
    <span id="me" class="me"></span>
    <button id="theme" class="icon-btn" title="Toggle light / dark" aria-label="Toggle theme">
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="hero" id="hero"></section>
  <section id="mine" class="mine" hidden></section>

  <nav class="toolbar" id="toolbar">
    <div class="chips" id="chips" role="tablist" aria-label="GPU type"></div>
    <div class="tools">
      <label class="toggle"><input type="checkbox" id="freeOnly"><span>Free only</span></label>
      <input id="search" type="search" placeholder="Filter user, job, node" autocomplete="off" spellcheck="false">
    </div>
  </nav>

  <section>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <div class="sec-head"><h2>Nodes</h2><span class="sec-note" id="mapNote"></span></div>
    <div id="map" class="map"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>When GPUs free up</h2>
      <div class="seg" id="range" role="group" aria-label="Time range">
        <button data-h="6">6h</button><button data-h="24" class="on">24h</button><button data-h="72">3d</button>
      </div>
    </div>
    <p class="sec-sub" id="chartSub"></p>
    <div id="chart" class="chart"></div>
  </section>

  <section>
    <div class="sec-head">
      <div class="seg tabs" id="tabs" role="tablist">
        <button data-tab="R" class="on">Running <span id="nR"></span></button>
        <button data-tab="PD">Queued <span id="nPD"></span></button>
      </div>
      <label class="toggle" id="blockedWrap" hidden><input type="checkbox" id="showBlocked"><span>Include held / blocked</span></label>
    </div>
    <div id="jobs" class="jobs"></div>
  </section>
  <footer id="foot"></footer>
</main>

<div id="tip" class="tip" role="tooltip" hidden></div>
<script src="app.js"></script>
</body>
</html>
